<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcia Bizi · Marmitas Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F7F3E9;
    --surface:#FFFFFF;
    --surface-2:#EFE8D6;
    --border:#E2D9BE;
    --ink:#262218;
    --muted:#8A8271;
    --primary:#2F6B4F;
    --primary-dark:#204A37;
    --primary-soft:#E3EEE7;
    --accent:#C98A1E;
    --accent-soft:#FBF0D6;
    --danger:#B5482D;
    --danger-soft:#F7E3DA;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}

  /* ---------- shell ---------- */
  #app{min-height:100vh;padding-bottom:64px;}
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(247,243,233,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-name{font-size:18px;line-height:1.15;}
  .brand-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}

  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;}
  .tab-btn{
    display:flex;align-items:center;gap:6px;padding:9px 14px;border:none;background:transparent;
    border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);transition:all .15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .tab-count{
    background:rgba(255,255,255,0.35);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:600;
  }
  .tab-btn:not(.active) .tab-count{background:var(--border);color:var(--ink);}

  .btn-cta{
    display:flex;align-items:center;gap:6px;padding:11px 18px;background:var(--accent);color:#fff;
    border:none;border-radius:11px;font-size:13.5px;font-weight:600;transition:filter .15s;
  }
  .btn-cta:hover{filter:brightness(1.06);}

  main{max-width:1180px;margin:0 auto;padding:32px 24px;}

  /* ---------- generic pieces ---------- */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .page-head h2{font-size:26px;margin-bottom:4px;}
  .page-head .sub{color:var(--muted);font-size:14px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;}
  .card + .card{margin-top:16px;}

  .pill-toggle{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;}
  .pill-toggle button{background:transparent;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);}
  .pill-toggle button.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,0.06);}

  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--muted);}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);}

  input[type=text],input[type=tel],input[type=number],input[type=date],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);
    font-size:13.5px;color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);}
  label.field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em;}

  .empty{
    text-align:center;padding:56px 20px;color:var(--muted);
  }
  .empty svg{margin-bottom:14px;opacity:0.5;}
  .empty h3{color:var(--ink);font-size:16px;margin-bottom:6px;}
  .empty p{font-size:13.5px;margin-bottom:18px;}

  /* ---------- cardapio ---------- */
  .hero{
    background:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark) 100%);
    border-radius:var(--radius-lg);padding:34px 30px;color:#fff;margin-bottom:24px;
    position:relative;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .hero h2{color:#fff;font-size:28px;margin-bottom:8px;}
  .hero p{color:rgba(255,255,255,0.78);font-size:14px;max-width:440px;line-height:1.5;}
  .hero .combos{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .combo-chip{
    background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:11px;
    padding:10px 14px;font-size:13px;
  }
  .combo-chip b{font-family:var(--font-mono);font-size:15px;display:block;margin-top:2px;}

  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .dish-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;
  }
  .dish-card:hover{border-color:var(--primary);}
  .dish-icon{
    width:44px;height:44px;border-radius:10px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;
  }
  .dish-name{font-size:14.5px;font-weight:600;line-height:1.35;}
  .dish-variacoes{display:flex;flex-wrap:wrap;gap:6px;}
  .var-chip{background:var(--surface-2);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:20px;}
  .dish-tag{
    align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;
    padding:3px 9px;border-radius:20px;
  }

  /* ---------- receipt-style pedido card ---------- */
  .receipt{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    position:relative;overflow:hidden;
  }
  .receipt::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,var(--surface-2) 0 8px,transparent 8px 16px);
  }
  .receipt-body{padding:20px;}
  .receipt-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .receipt-client{font-size:16px;font-weight:600;}
  .receipt-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .receipt-total{font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--primary);text-align:right;}
  .receipt-date{font-size:11.5px;color:var(--muted);text-align:right;margin-top:2px;}
  .receipt-divider{border-top:1px dashed var(--border);margin:12px 0;}
  .receipt-line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  .receipt-line .qty{color:var(--muted);font-family:var(--font-mono);width:32px;flex-shrink:0;}
  .receipt-custom{background:var(--accent-soft);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:12.5px;white-space:pre-wrap;}
  .receipt-actions{display:flex;gap:8px;margin-top:14px;}
  .btn-sm{
    display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
    border:1px solid var(--border);background:var(--surface);color:var(--ink);
  }
  .btn-sm:hover{border-color:var(--muted);}
  .btn-sm.danger:hover{border-color:var(--danger);color:var(--danger);}

  /* ---------- dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;}
  .kpi-label{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;}
  @media(max-width:820px){.two-col{grid-template-columns:1fr;}}
  .custos-grid{display:flex;align-items:flex-start;gap:0;}
  .custos-col-left{width:var(--ingr-w,290px);flex-shrink:0;min-width:0;}
  .custos-resizer{
    width:18px;align-self:stretch;flex-shrink:0;cursor:col-resize;display:flex;align-items:center;
    justify-content:center;touch-action:none;
  }
  .custos-resizer .grip{width:4px;height:44px;border-radius:4px;background:var(--border);transition:background .15s;}
  .custos-resizer:hover .grip,.custos-resizer.dragging .grip{background:var(--primary);}
  .custos-col-right{flex:1;min-width:0;}
  @media(max-width:900px){
    .custos-grid{flex-direction:column;}
    .custos-col-left{width:100% !important;}
    .custos-resizer{display:none;}
  }
  .bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .bar-row .rank{width:18px;font-size:12px;color:var(--muted);font-family:var(--font-mono);flex-shrink:0;}
  .bar-row .label{width:150px;flex-shrink:0;font-size:12.5px;line-height:1.3;}
  .bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);border-radius:6px;}
  .bar-value{width:34px;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600;flex-shrink:0;}
  .client-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .client-row:last-child{border-bottom:none;}

  /* ---------- custos ---------- */
  .ingr-search{position:relative;margin-bottom:10px;}
  .ingr-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
  .ingr-search input{padding-left:34px;}
  .ingr-row{
    display:flex;flex-direction:column;gap:7px;padding:10px 8px;border-bottom:1px solid var(--border);
  }
  .ingr-row:last-child{border-bottom:none;}
  .ingr-row:hover{background:var(--surface-2);}
  .ingr-name{font-size:12.5px;font-weight:500;line-height:1.3;}
  .ingr-name .badge-warn{display:inline-block;margin-left:6px;font-size:9.5px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:20px;vertical-align:middle;}
  .ingr-row-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ingr-price-wrap{flex-shrink:0;display:flex;align-items:center;gap:4px;}
  .ingr-price-wrap .cur{font-size:11px;color:var(--muted);flex-shrink:0;}
  .ingr-price-wrap .unit{font-size:11px;color:var(--muted);flex-shrink:0;}
  .ingr-price{font-family:var(--font-mono);font-size:12.5px;width:68px;text-align:right;padding:5px 7px;flex-shrink:0;}
  .ingr-row-actions{display:flex;gap:5px;flex-shrink:0;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .var-selector{display:flex;flex-wrap:wrap;gap:6px;}
  .var-chip-btn{
    padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:500;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);
  }
  .var-chip-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .recipe-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:9px;margin-bottom:8px;}
  .recipe-item .name{flex:1;font-size:14px;}
  .recipe-item .name .sub{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);margin-top:2px;}
  .recipe-item input[type=number]{width:84px;flex-shrink:0;}
  .recipe-item .subtotal{width:88px;flex-shrink:0;text-align:right;font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--primary);}
  .metric-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:600px){.metric-3{grid-template-columns:1fr;}}
  .metric-card{border-radius:var(--radius-md);padding:16px;background:var(--primary-soft);}
  .metric-card .lbl{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .metric-card .val{font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--primary);}
  .metric-card.neg{background:var(--danger-soft);}
  .metric-card.neg .val{color:var(--danger);}
  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-nav span{font-size:13px;font-weight:600;min-width:88px;text-align:center;}
  .banner{
    display:flex;align-items:center;gap:10px;background:var(--accent-soft);color:#5c4212;border-radius:11px;
    padding:11px 15px;font-size:13px;margin-bottom:18px;
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(38,34,24,0.45);z-index:50;display:flex;align-items:flex-start;
    justify-content:center;padding:32px 16px;overflow-y:auto;
  }
  .modal{
    background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border);}
  .modal-body{padding:22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:9px;font-size:13.5px;font-weight:600;}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 20px;border-radius:9px;font-size:13.5px;font-weight:500;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
  .field{margin-bottom:14px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;}
  .check-row input{width:auto;}
  .combo-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
  .combo-opt{
    border:1.5px solid var(--border);border-radius:10px;padding:11px;text-align:center;background:var(--surface);
  }
  .combo-opt.active{border-color:var(--primary);background:var(--primary-soft);}
  .combo-opt .n{font-family:var(--font-mono);font-weight:600;font-size:15px;}
  .combo-opt .p{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .item-stepper{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--border);}
  .item-stepper:last-child{border-bottom:none;}
  .item-stepper .nm{font-size:12.5px;flex:1;padding-right:8px;}
  .stepper-ctrl{display:flex;align-items:center;gap:8px;}
  .stepper-ctrl button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:14px;line-height:1;}
  .stepper-ctrl .val{width:20px;text-align:center;font-family:var(--font-mono);font-size:13px;}
  .progress-note{font-size:12.5px;padding:9px 12px;border-radius:9px;background:var(--surface-2);margin:10px 0;text-align:center;font-weight:500;}
  .progress-note.ok{background:var(--primary-soft);color:var(--primary);}

  .loading-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);font-size:13.5px;}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin-icon svg{animation:spin .7s linear infinite;}

  @media(max-width:640px){
    .brand-name{font-size:15px;}
    .tab-btn span.lbl{display:none;}
    .tab-btn{padding:9px 11px;}
    main{padding:22px 14px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA MODEL
   ========================================================= */
const CARDAPIO = [
  { id:"1", nome:"Frango Desfiado com Purê", variacoes:["Purê de Batata Doce","Purê de Batata Inglesa"], icon:"leaf" },
  { id:"2", nome:"Patinho Moído com Purê", variacoes:["Purê de Batata Doce","Purê de Batata Inglesa"], icon:"meat" },
  { id:"3", nome:"Escondidinho de Abóbora", variacoes:["com Patinho Moído","com Frango Desfiado"], icon:"bowl" },
  { id:"4", nome:"Frango Teriyaki, Arroz Integral e Legumes ao Vapor", icon:"leaf" },
  { id:"5", nome:"Panqueca Colorida (2un) com Frango e Patinho", icon:"stack" },
  { id:"6", nome:"Iscas de Carne com Arroz e Mix de Legumes", icon:"meat" },
  { id:"7", nome:"Strogonoff com Arroz e Brócolis", variacoes:["de Carne","de Frango"], icon:"bowl" },
  { id:"8", nome:"Quibe Assado com Arroz e Mix de Legumes", icon:"bowl" },
  { id:"9", nome:"Macarrão ao Molho Bolognesa", icon:"stack" },
  { id:"10", nome:"Tilápia Assada, Purê de Abóbora e Brócolis", adicionalTilapia:true, icon:"fish" },
];

const VARIACOES_MARMITAS = [
  { id:"1.1", nome:"1.1 · Frango Desfiado c/ Batata Doce", marmitaBase:"1", variacao:0 },
  { id:"1.2", nome:"1.2 · Frango Desfiado c/ Batata Inglesa", marmitaBase:"1", variacao:1 },
  { id:"2.1", nome:"2.1 · Patinho Moído c/ Batata Doce", marmitaBase:"2", variacao:0 },
  { id:"2.2", nome:"2.2 · Patinho Moído c/ Batata Inglesa", marmitaBase:"2", variacao:1 },
  { id:"3.1", nome:"3.1 · Escondidinho c/ Patinho Moído", marmitaBase:"3", variacao:0 },
  { id:"3.2", nome:"3.2 · Escondidinho c/ Frango Desfiado", marmitaBase:"3", variacao:1 },
  { id:"4", nome:"4 · Frango Teriyaki", marmitaBase:"4", variacao:null },
  { id:"5", nome:"5 · Panqueca Colorida", marmitaBase:"5", variacao:null },
  { id:"6", nome:"6 · Iscas de Carne", marmitaBase:"6", variacao:null },
  { id:"7.1", nome:"7.1 · Strogonoff de Carne", marmitaBase:"7", variacao:0 },
  { id:"7.2", nome:"7.2 · Strogonoff de Frango", marmitaBase:"7", variacao:1 },
  { id:"8", nome:"8 · Quibe Assado", marmitaBase:"8", variacao:null },
  { id:"9", nome:"9 · Macarrão Bolognesa", marmitaBase:"9", variacao:null },
  { id:"10", nome:"10 · Tilápia Assada", marmitaBase:"10", variacao:null },
];

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

const DEFAULT_CONFIG = {
  precos: { 5:115, 10:215, 20:410 },
  frete: 10,
  adicionalTilapia: 2,
};

// Preços de ingredientes vieram da planilha "Custos - Marmita.xlsx" (coluna "Novo Valor" quando existia).
// Itens marcados com estimado:true não constavam na planilha de preços e foram estimados — revise-os na aba Custos.
const INGREDIENTES_SEED = [

/* =========================================================
   SUPABASE — configuração
   Preencha com os dados do SEU projeto (Project Settings → API no painel do Supabase).
   A "anon key" é pública por natureza (fica visível no código do site) — não é a service_role key.
   ========================================================= */
const SUPABASE_URL = "SUA_SUPABASE_URL_AQUI";
const SUPABASE_ANON_KEY = "SUA_SUPABASE_ANON_KEY_AQUI";
const SUPABASE_CONFIGURADO = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;

let supa = null;
if(SUPABASE_CONFIGURADO && window.supabase){
  supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

async function persistPedidos(){
  if(!supa) return;
  try{
    const { error } = await supa.from("app_data").upsert({ key:"pedidos", value: state.pedidos, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error("Erro ao salvar pedidos no Supabase", e); ui.storageOk = false; }
}
async function persistCustos(){
  if(!supa) return;
  try{
    const value = { ingredientes: state.ingredientes, receitas: state.receitas, config: state.config, lastUpdated: state.lastUpdated };
    const { error } = await supa.from("app_data").upsert({ key:"custos", value, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error("Erro ao salvar custos no Supabase", e); ui.storageOk = false; }
}
async function savePrefs(){
  // preferência de layout: mantida só localmente (não precisa ir para o banco compartilhado)
  try{ localStorage.setItem("marmitas_prefs", JSON.stringify({ ingrPanelWidth: ui.ingrPanelWidth })); }
  catch(e){ /* opcional, falha silenciosa */ }
}
async function loadPrefs(){
  try{
    const raw = localStorage.getItem("marmitas_prefs");
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.ingrPanelWidth) ui.ingrPanelWidth = parsed.ingrPanelWidth;
    }
  }catch(e){ /* usa o padrão */ }
}

async function loadAll(){
  await loadPrefs();

  if(!SUPABASE_CONFIGURADO){
    ui.loading = false;
    ui.setupNeeded = true;
    render();
    return;
  }
  if(!supa){
    ui.loading = false;
    ui.setupNeeded = true;
    ui.setupError = "A biblioteca do Supabase não carregou. Verifique sua conexão e recarregue a página.";
    render();
    return;
  }

  try{
    const { data, error } = await supa.from("app_data").select("key,value").in("key", ["pedidos","custos"]);
    if(error) throw error;
    const pedidosRow = data.find(r=>r.key==="pedidos");
    const custosRow = data.find(r=>r.key==="custos");

    state.pedidos = pedidosRow ? pedidosRow.value : [];

    if(custosRow){
      const parsed = custosRow.value;
      state.ingredientes = parsed.ingredientes && parsed.ingredientes.length ? parsed.ingredientes : INGREDIENTES_SEED;
      state.receitas = parsed.receitas && Object.keys(parsed.receitas).length ? parsed.receitas : RECEITAS_SEED;
      state.config = parsed.config || DEFAULT_CONFIG;
      state.lastUpdated = parsed.lastUpdated || null;
    } else {
      state.ingredientes = JSON.parse(JSON.stringify(INGREDIENTES_SEED));
      state.receitas = JSON.parse(JSON.stringify(RECEITAS_SEED));
      state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      state.lastUpdated = Date.now();
      await persistCustos();
    }
    if(!pedidosRow) await persistPedidos();

    ui.loading = false;
    ui.lastSync = Date.now();
    render();
    startRealtimeSync();
  }catch(e){
    console.error("Erro ao carregar dados do Supabase", e);
    ui.loading = false;
    ui.setupNeeded = true;
    ui.setupError = "Não foi possível conectar ao Supabase. Confira a URL/chave e se a tabela 'app_data' existe (veja o README).";
    render();
  }
}

/* =========================================================
   SINCRONIZAÇÃO EM TEMPO REAL (Supabase Realtime)
   ========================================================= */
function startRealtimeSync(){
  if(!supa) return;
  supa.channel("app_data-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"app_data" }, (payload)=>{
      if(ui.modal) return; // não interrompe quem está no meio de um pedido
      const row = payload.new;
      if(!row) return;
      if(row.key==="pedidos"){ state.pedidos = row.value; }
      if(row.key==="custos"){
        state.ingredientes = row.value.ingredientes || state.ingredientes;
        state.receitas = row.value.receitas || state.receitas;
        state.config = row.value.config || state.config;
        state.lastUpdated = row.value.lastUpdated || state.lastUpdated;
      }
      ui.lastSync = Date.now();
      render();
    })
    .subscribe();
}

async function syncFromStorage(manual){
  if(!supa) return;
  ui.syncing = true;
  try{
    const { data, error } = await supa.from("app_data").select("key,value").in("key", ["pedidos","custos"]);
    if(!error && data){
      const pedidosRow = data.find(r=>r.key==="pedidos");
      const custosRow = data.find(r=>r.key==="custos");
      if(pedidosRow) state.pedidos = pedidosRow.value;
      if(custosRow){
        state.ingredientes = custosRow.value.ingredientes || state.ingredientes;
        state.receitas = custosRow.value.receitas || state.receitas;
        state.config = custosRow.value.config || state.config;
        state.lastUpdated = custosRow.value.lastUpdated || state.lastUpdated;
      }
    }
  }catch(e){ /* mantém dados atuais se falhar */ }
  ui.syncing = false;
  ui.lastSync = Date.now();
  render();
}

function exportarBackup(){
  const backup = {
    versao: 1, exportadoEm: new Date().toISOString(),
    pedidos: state.pedidos, ingredientes: state.ingredientes, receitas: state.receitas,
    config: state.config, lastUpdated: state.lastUpdated,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `backup-marmitas-${todayISO()}.json`;
  link.click();
}

function importarBackup(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm("Isso vai substituir todos os dados atuais no Supabase pelos dados do arquivo de backup. Continuar?")) return;
      state.pedidos = data.pedidos || [];
      state.ingredientes = data.ingredientes || INGREDIENTES_SEED;
      state.receitas = data.receitas || RECEITAS_SEED;
      state.config = data.config || DEFAULT_CONFIG;
      state.lastUpdated = data.lastUpdated || Date.now();
      await persistPedidos();
      await persistCustos();
      render();
      alert("Backup importado com sucesso.");
    }catch(err){
      alert("Não foi possível ler esse arquivo. Verifique se é um backup válido gerado por este app.");
    }
  };
  reader.readAsText(file);
}

   HELPERS
   ========================================================= */
function money(n){
  n = Number(n)||0;
  return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR");
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function startOfWeek(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function startOfMonth(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfYear(){ const d=new Date(); return new Date(d.getFullYear(), 0, 1); }

function getDish(marmitaId){ return CARDAPIO.find(m=>m.id===marmitaId); }
function getVariacao(varId){ return VARIACOES_MARMITAS.find(v=>v.id===varId); }
function variacaoIdFromItem(item){
  const v = VARIACOES_MARMITAS.find(v => v.marmitaBase===item.marmitaId && (v.variacao ?? null) === (item.variacaoSelecionada ?? null));
  return v ? v.id : null;
}
function nomeVariacaoCompleto(varId){
  const v = getVariacao(varId); if(!v) return varId;
  const dish = getDish(v.marmitaBase); if(!dish) return v.nome;
  if(v.variacao !== null && dish.variacoes) return dish.nome + " — " + dish.variacoes[v.variacao];
  return dish.nome;
}
function getReceita(varId){
  return state.receitas[varId] || { ingredientes:[], percentualExtra:0 };
}
function getIngrediente(id){ return state.ingredientes.find(i=>i.id===id); }

function custoMarmita(varId){
  const receita = getReceita(varId);
  const base = receita.ingredientes.reduce((tot,ing)=>{
    const i = getIngrediente(ing.ingredienteId);
    if(!i) return tot;
    return tot + (i.precoPorKg/1000) * ing.quantidadeGramas;
  },0);
  return base * (1 + (receita.percentualExtra||0)/100);
}

function custoPedido(pedido){
  if(pedido.personalizado) return null; // custo desconhecido para pedidos personalizados
  return pedido.itens.reduce((tot,item)=>{
    const varId = variacaoIdFromItem(item);
    if(!varId) return tot;
    return tot + custoMarmita(varId) * item.quantidade;
  },0);
}

function pedidosNoPeriodo(startDate){
  return state.pedidos.filter(p => new Date(p.data+"T00:00:00") >= startDate);
}
function pedidosDoMes(mes){
  const ano = new Date().getFullYear();
  return state.pedidos.filter(p=>{
    const d = new Date(p.data+"T00:00:00");
    return d.getMonth()===mes && d.getFullYear()===ano;
  });
}

// preço médio de venda por marmita no mês = ticket médio por unidade dos combos vendidos
// (o preço é definido por combo, não por prato — ver nota na interface)
function precoMedioPorUnidade(mes){
  const pedidos = pedidosDoMes(mes).filter(p=>!p.personalizado && p.quantidade);
  if(pedidos.length===0) return state.config.precos[5] / 5;
  let totalReceitaSemFrete = 0, totalUnidades = 0;
  pedidos.forEach(p=>{
    totalReceitaSemFrete += (p.valorTotal - (p.freteValor||0));
    totalUnidades += p.quantidade;
  });
  return totalUnidades > 0 ? totalReceitaSemFrete/totalUnidades : state.config.precos[5]/5;
}

function daysSince(ts){
  if(!ts) return null;
  return Math.floor((Date.now()-ts)/(1000*60*60*24));
}
function syncLabel(){
  if(ui.syncing) return "Sincronizando…";
  if(!ui.lastSync) return "Atualizar agora";
  const secs = Math.floor((Date.now()-ui.lastSync)/1000);
  if(secs<10) return "Atualizado agora — clique para verificar novidades";
  if(secs<60) return `Atualizado há ${secs}s — clique para verificar novidades`;
  const mins = Math.floor(secs/60);
  return `Atualizado há ${mins} min — clique para verificar novidades`;
}

function render(){
  const app = document.getElementById("app");
  if(ui.loading){
    app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><p>Carregando dados da marmitaria…</p></div>`;
    return;
  }
  if(ui.setupNeeded){
    app.innerHTML = renderSetupScreen();
    return;
  }
  app.innerHTML = `
    ${renderTopbar()}
    <main>${renderTab()}</main>
    ${ui.modal ? renderModal() : ""}
  `;
  bindGlobalEvents();
  if(ui.tab==="custos") bindResizer();
}

function bindResizer(){
  const handle = document.getElementById("custos-resizer");
  const grid = document.querySelector(".custos-grid");
  if(!handle || !grid) return;
  handle.addEventListener("pointerdown",(e)=>{
    e.preventDefault();
    handle.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    const startX = e.clientX;
    const startWidth = ui.ingrPanelWidth;
    let latest = startWidth;
    function onMove(ev){
      const delta = ev.clientX - startX;
      latest = Math.min(460, Math.max(220, startWidth + delta));
      grid.style.setProperty("--ingr-w", latest+"px");
    }
    function onUp(){
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      handle.classList.remove("dragging");
      ui.ingrPanelWidth = latest;
      savePrefs();
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
  });
}

/* =========================================================
   RENDER — DASHBOARD
   ========================================================= */
function renderDashboard(){
  const startMap = {semana:startOfWeek(), mes:startOfMonth(), ano:startOfYear()};
  const pedidos = pedidosNoPeriodo(startMap[ui.dashPeriodo]);
  const label = {semana:"Semana",mes:"Mês",ano:"Ano"}[ui.dashPeriodo];

  const receitaTotal = pedidos.reduce((t,p)=>t+p.valorTotal,0);
  const freteTotal = pedidos.reduce((t,p)=>t+(p.freteValor||0),0);
  const receitaSemFrete = receitaTotal - freteTotal;

  const custoConhecidoPedidos = pedidos.filter(p=>!p.personalizado);
  const lucroReal = custoConhecidoPedidos.reduce((t,p)=>{
    const c = custoPedido(p);
    return t + (p.valorTotal - (c||0));
  },0);
  const pedidosComCustoDesconhecido = pedidos.length - custoConhecidoPedidos.length;

  const contagemClientes = {};
  pedidos.forEach(p=> contagemClientes[p.nomeCliente] = (contagemClientes[p.nomeCliente]||0)+1);
  const recorrentes = Object.entries(contagemClientes).filter(([,q])=>q>1).sort((a,b)=>b[1]-a[1]);

  const contagemPratos = {};
  pedidos.forEach(p=>{
    if(p.personalizado) return;
    p.itens.forEach(item=>{
      const varId = variacaoIdFromItem(item);
      if(!varId) return;
      contagemPratos[varId] = (contagemPratos[varId]||0) + item.quantidade;
    });
  });
  const topPratos = Object.entries(contagemPratos).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxPrato = topPratos.length ? topPratos[0][1] : 1;

  return `
  <div class="page-head">
    <div><h2>Dashboard</h2><div class="sub">Análise de pedidos e vendas</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <div class="pill-toggle">
        ${["semana","mes","ano"].map(p=>`<button class="${ui.dashPeriodo===p?'active':''}" data-action="dash-periodo" data-val="${p}">${({semana:"Semana",mes:"Mês",ano:"Ano"})[p]}</button>`).join("")}
      </div>
      <button class="btn-sm" data-action="exportar-csv">${icon("download")}Exportar CSV</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">${icon("list")} Pedidos · ${label}</div><div class="kpi-value">${pedidos.length}</div></div>
    <div class="kpi"><div class="kpi-label">${icon("coin")} Receita total</div><div class="kpi-value">${money(receitaTotal)}</div></div>
    <div class="kpi"><div class="kpi-label">${icon("users")} Clientes recorrentes</div><div class="kpi-value">${recorrentes.length}</div></div>
    <div class="kpi"><div class="kpi-label">${icon("truck")} Receita de frete</div><div class="kpi-value">${money(freteTotal)}</div></div>
  </div>

  <div class="two-col">
    <div class="card">
      <h3 style="margin-bottom:14px;font-size:15px;">Pratos mais vendidos · ${label}</h3>
      ${topPratos.length===0 ? `<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0;">Nenhum dado no período.</p>` :
        topPratos.map(([varId,qtd],i)=>`
          <div class="bar-row">
            <span class="rank">${i+1}</span>
            <span class="label">${nomeVariacaoCompleto(varId)}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${(qtd/maxPrato*100).toFixed(0)}%"></span></span>
            <span class="bar-value">${qtd}</span>
          </div>
        `).join("")}
    </div>
    <div class="card">
      <h3 style="margin-bottom:14px;font-size:15px;">Clientes recorrentes · ${label}</h3>
      ${recorrentes.length===0 ? `<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0;">Nenhum cliente recorrente ainda.</p>` :
        recorrentes.map(([nome,qtd])=>`
          <div class="client-row"><span>${escapeHtml(nome)}</span><span class="mono" style="color:var(--muted)">${qtd} pedidos</span></div>
        `).join("")}
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3 style="margin-bottom:14px;font-size:15px;">Resumo financeiro · ${label}</h3>
    <div class="metric-3">
      <div class="metric-card"><div class="lbl">Receita sem frete</div><div class="val">${money(receitaSemFrete)}</div></div>
      <div class="metric-card"><div class="lbl">Frete</div><div class="val">${money(freteTotal)}</div></div>
      <div class="metric-card ${lucroReal<0?'neg':''}"><div class="lbl">Lucro real (receita − custo de ingredientes)</div><div class="val">${money(lucroReal)}</div></div>
    </div>
    ${pedidosComCustoDesconhecido>0?`<p style="font-size:12px;color:var(--muted);margin-top:10px;">${pedidosComCustoDesconhecido} pedido${pedidosComCustoDesconhecido!==1?"s":""} personalizado${pedidosComCustoDesconhecido!==1?"s":""} não ${pedidosComCustoDesconhecido!==1?"entram":"entra"} nesse cálculo de custo (não têm receita associada).</p>`:""}
  </div>`;
}

function draftFromPedido(p){
  return {
    id:p.id, nomeCliente:p.nomeCliente, telefone:p.telefone, endereco:p.endereco, data:p.data,
    retirada: !!p.retirada, personalizado: !!p.personalizado,
    quantidade: p.quantidade||null, itens: p.itens?JSON.parse(JSON.stringify(p.itens)):[],
    itemPersonalizado: p.itemPersonalizado?{...p.itemPersonalizado}:{descricao:""},
    valorManual: p.personalizado?p.valorTotal:"", quantidadeManual: p.personalizado?p.quantidade:"",
  };
}

function openModal(mode, pedido){
  modalDraft = mode==="editar" ? draftFromPedido(pedido) : newDraft();
  ui.modal = { mode };
  render();
}
function closeModal(){ ui.modal=null; modalDraft=null; render(); }

function itemQtd(varId){
  const v = getVariacao(varId);
  const item = modalDraft.itens.find(i=>i.marmitaId===v.marmitaBase && (i.variacaoSelecionada??null)===(v.variacao??null));
  return item ? item.quantidade : 0;
}
function setItemQtd(varId, qtd){
  const v = getVariacao(varId);
  const idx = modalDraft.itens.findIndex(i=>i.marmitaId===v.marmitaBase && (i.variacaoSelecionada??null)===(v.variacao??null));
  if(qtd<=0){ if(idx>-1) modalDraft.itens.splice(idx,1); return; }
  if(idx>-1) modalDraft.itens[idx].quantidade = qtd;
  else modalDraft.itens.push({marmitaId:v.marmitaBase, quantidade:qtd, variacaoSelecionada: v.variacao ?? undefined});
}
function totalItensEscolhidos(){ return modalDraft.itens.reduce((t,i)=>t+i.quantidade,0); }

function calcValorTotal(){
  if(modalDraft.personalizado){
    return Number(modalDraft.valorManual)||0;
  }
  if(!modalDraft.quantidade) return 0;
  let total = state.config.precos[modalDraft.quantidade] || 0;
  if(!modalDraft.retirada) total += state.config.frete;
  modalDraft.itens.forEach(item=>{
    const dish = getDish(item.marmitaId);
    if(dish && dish.adicionalTilapia) total += state.config.adicionalTilapia * item.quantidade;
  });
  return total;
}

function renderModal(){
  const d = modalDraft;
  const combos = Object.keys(state.config.precos).map(Number);
  const totalEscolhido = totalItensEscolhidos();
  const alvo = d.quantidade || 0;
  const podeSalvar = d.nomeCliente.trim().length>0 && (
    d.personalizado ? Number(d.valorManual)>0 :
    (d.quantidade && totalEscolhido===alvo)
  );
  const valorPreview = calcValorTotal();

  return `
  <div class="modal-overlay" data-action="overlay">
    <div class="modal" data-stop="1">
      <div class="modal-head">
        <h3 style="font-size:17px;">${ui.modal.mode==="editar"?"Editar pedido":"Novo pedido"}</h3>
        <button class="icon-btn" data-action="fechar-modal">${icon("x")}</button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field"><label class="field-label">Nome do cliente</label><input type="text" id="f-nome" value="${escapeAttr(d.nomeCliente)}" placeholder="Nome completo"></div>
          <div class="field"><label class="field-label">Telefone</label><input type="tel" id="f-tel" value="${escapeAttr(d.telefone)}" placeholder="(19) 90000-0000"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="field-label">Endereço</label><input type="text" id="f-end" value="${escapeAttr(d.endereco)}" placeholder="Rua, número, bairro"></div>
          <div class="field"><label class="field-label">Data</label><input type="date" id="f-data" value="${d.data}"></div>
        </div>
        <div class="check-row"><input type="checkbox" id="f-retirada" ${d.retirada?"checked":""}><label for="f-retirada">Retirada no local (sem frete)</label></div>
        <div class="check-row"><input type="checkbox" id="f-personalizado" ${d.personalizado?"checked":""}><label for="f-personalizado">Pedido personalizado (fora do combo padrão)</label></div>

        ${d.personalizado ? `
          <div class="field"><label class="field-label">Descrição do pedido</label><textarea id="f-desc" rows="3" placeholder="Descreva o que o cliente pediu">${escapeHtml(d.itemPersonalizado.descricao||"")}</textarea></div>
          <div class="field-row">
            <div class="field"><label class="field-label">Quantidade (marmitas)</label><input type="number" id="f-qtd-manual" value="${d.quantidadeManual}" placeholder="0"></div>
            <div class="field"><label class="field-label">Valor total (R$)</label><input type="number" step="0.01" id="f-valor-manual" value="${d.valorManual}" placeholder="0,00"></div>
          </div>
        ` : `
          <label class="field-label">Combo</label>
          <div class="combo-pick">
            ${combos.map(q=>`
              <button class="combo-opt ${d.quantidade===q?'active':''}" data-action="escolher-combo" data-qtd="${q}">
                <div class="n">${q} un</div><div class="p mono">${money(state.config.precos[q])}</div>
              </button>
            `).join("")}
          </div>
          ${d.quantidade ? `
            <div class="progress-note ${totalEscolhido===alvo?'ok':''}">
              ${totalEscolhido}/${alvo} marmitas selecionadas ${totalEscolhido===alvo?"— completo":""}
            </div>
            <div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:4px 12px;">
              ${VARIACOES_MARMITAS.map(v=>`
                <div class="item-stepper">
                  <span class="nm">${v.nome}</span>
                  <div class="stepper-ctrl">
                    <button data-action="item-dec" data-var="${v.id}" type="button">−</button>
                    <span class="val">${itemQtd(v.id)}</span>
                    <button data-action="item-inc" data-var="${v.id}" type="button">+</button>
                  </div>
                </div>
              `).join("")}
            </div>
          ` : `<p style="font-size:12.5px;color:var(--muted);text-align:center;padding:12px 0;">Escolha um combo para montar os itens.</p>`}
        `}

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);">
          <span style="font-size:13px;color:var(--muted);">Valor total</span>
          <span class="mono" style="font-size:20px;font-weight:600;color:var(--primary);">${money(valorPreview)}</span>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" data-action="fechar-modal">Cancelar</button>
        <button class="btn-primary" data-action="salvar-pedido" ${podeSalvar?"":"disabled"}>Salvar pedido</button>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   EVENTS
   ========================================================= */
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function bindGlobalEvents(){
  document.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.getAttribute("data-action");
    if(el._bound) return;
    el._bound = true;

    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA"){
      const evt = (el.type==="number" || el.tagName==="TEXTAREA" || el.type==="text") ? "change" : "change";
      el.addEventListener(evt, (e)=>handleAction(action, el, e));
      if(el.type==="number" && (action==="atualizar-preco")){
        el.addEventListener("blur",(e)=>handleAction(action, el, e));
      }
    } else {
      el.addEventListener("click",(e)=>{ if(el.hasAttribute("disabled")) return; handleAction(action, el, e); });
    }
  });

  // live-preview inputs inside modal (don't need full re-render on every keystroke)
  if(ui.modal){
    const overlay = document.querySelector(".modal-overlay");
    if(overlay) overlay.addEventListener("click",(e)=>{ if(e.target===overlay) closeModal(); });
    ["f-nome","f-tel","f-end","f-data","f-desc","f-qtd-manual","f-valor-manual"].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener("input", ()=>syncDraftFromForm(false));
    });
    const r = document.getElementById("f-retirada"); if(r) r.addEventListener("change", ()=>{ modalDraft.retirada=r.checked; render(); });
    const p = document.getElementById("f-personalizado"); if(p) p.addEventListener("change", ()=>{ syncDraftFromForm(true); modalDraft.personalizado=p.checked; render(); });
  }

  const search = document.getElementById("ingr-search");
  if(search){
    search.addEventListener("input", ()=>{
      ui.ingredienteSearch = search.value;
      const pos = search.selectionStart;
      render();
      const el2 = document.getElementById("ingr-search");
      if(el2){ el2.focus(); el2.setSelectionRange(pos,pos); }
    });
  }

  const fileInput = document.getElementById("import-file-input");
  if(fileInput && !fileInput._bound){
    fileInput._bound = true;
    fileInput.addEventListener("change", (e)=>{
      if(e.target.files && e.target.files[0]) importarBackup(e.target.files[0]);
      e.target.value = "";
    });
  }
}

function syncDraftFromForm(skipRender){
  const g = id => { const el=document.getElementById(id); return el?el.value:undefined; };
  if(g("f-nome")!==undefined) modalDraft.nomeCliente = g("f-nome");
  if(g("f-tel")!==undefined) modalDraft.telefone = g("f-tel");
  if(g("f-end")!==undefined) modalDraft.endereco = g("f-end");
  if(g("f-data")!==undefined) modalDraft.data = g("f-data");
  if(g("f-desc")!==undefined) modalDraft.itemPersonalizado.descricao = g("f-desc");
  if(g("f-qtd-manual")!==undefined) modalDraft.quantidadeManual = g("f-qtd-manual");
  if(g("f-valor-manual")!==undefined) modalDraft.valorManual = g("f-valor-manual");
  if(!skipRender) updateFooterOnly();
}

function updateFooterOnly(){
  const val = document.querySelector(".modal-foot")?.previousElementSibling?.querySelector(".mono");
  // simplest reliable approach: just re-render whole modal (cheap enough)
  const scrollPos = document.querySelector(".modal-body")?.scrollTop || 0;
  render();
  const mb = document.querySelector(".modal-body");
  if(mb) mb.scrollTop = scrollPos;
}

async function handleAction(action, el, e){
  switch(action){
    case "tab": ui.tab = el.getAttribute("data-tab"); render(); break;
    case "novo-pedido": openModal("novo"); break;
    case "sync-agora": await syncFromStorage(true); break;
    case "exportar-backup": exportarBackup(); break;
    case "importar-backup": document.getElementById("import-file-input").click(); break;
    case "editar-pedido": {
      const p = state.pedidos.find(x=>x.id===el.getAttribute("data-id"));
      if(p) openModal("editar", p);
      break;
    }
    case "excluir-pedido": {
      const id = el.getAttribute("data-id");
      if(confirm("Tem certeza que deseja excluir este pedido?")){
        state.pedidos = state.pedidos.filter(p=>p.id!==id);
        await persistPedidos();
        render();
      }
      break;
    }
    case "pedidos-filtro": ui.pedidosFiltro = el.getAttribute("data-val"); render(); break;
    case "dash-periodo": ui.dashPeriodo = el.getAttribute("data-val"); render(); break;
    case "exportar-csv": exportarCSV(); break;

    case "fechar-modal": closeModal(); break;
    case "overlay": break;
    case "escolher-combo": {
      modalDraft.quantidade = Number(el.getAttribute("data-qtd"));
      modalDraft.itens = [];
      render();
      break;
    }
    case "item-inc": {
      const varId = el.getAttribute("data-var");
      if(totalItensEscolhidos() >= modalDraft.quantidade) break;
      setItemQtd(varId, itemQtd(varId)+1);
      render();
      break;
    }
    case "item-dec": {
      const varId = el.getAttribute("data-var");
      setItemQtd(varId, Math.max(0,itemQtd(varId)-1));
      render();
      break;
    }
    case "salvar-pedido": await salvarPedido(); break;

    case "novo-ingrediente": showNovoIngredienteForm(); break;
    case "atualizar-preco": {
      const id = el.getAttribute("data-id");
      const ing = getIngrediente(id);
      if(ing){ ing.precoPorKg = Number(el.value)||0; state.lastUpdated = Date.now(); await persistCustos(); }
      break;
    }
    case "excluir-ingrediente": {
      const id = el.getAttribute("data-id");
      if(confirm("Excluir este ingrediente? Ele também será removido das receitas.")){
        state.ingredientes = state.ingredientes.filter(i=>i.id!==id);
        Object.values(state.receitas).forEach(r=> r.ingredientes = r.ingredientes.filter(x=>x.ingredienteId!==id));
        await persistCustos();
        render();
      }
      break;
    }
    case "add-a-receita": {
      const id = el.getAttribute("data-id");
      const receita = getReceita(ui.custosVar);
      if(receita.ingredientes.find(x=>x.ingredienteId===id)){ break; }
      receita.ingredientes.push({ingredienteId:id, quantidadeGramas:0});
      state.receitas[ui.custosVar] = receita;
      await persistCustos();
      render();
      break;
    }
    case "custos-var": ui.custosVar = el.getAttribute("data-val"); render(); break;
    case "receita-gramas": {
      const ingId = el.getAttribute("data-ing");
      const receita = getReceita(ui.custosVar);
      const item = receita.ingredientes.find(x=>x.ingredienteId===ingId);
      if(item){ item.quantidadeGramas = Number(el.value)||0; state.receitas[ui.custosVar]=receita; await persistCustos(); render(); }
      break;
    }
    case "receita-remover": {
      const ingId = el.getAttribute("data-ing");
      const receita = getReceita(ui.custosVar);
      receita.ingredientes = receita.ingredientes.filter(x=>x.ingredienteId!==ingId);
      state.receitas[ui.custosVar]=receita;
      await persistCustos(); render();
      break;
    }
    case "receita-extra": {
      const receita = getReceita(ui.custosVar);
      receita.percentualExtra = Number(el.value)||0;
      state.receitas[ui.custosVar]=receita;
      await persistCustos(); render();
      break;
    }
    case "mes-prev": ui.custosMes = ui.custosMes>0?ui.custosMes-1:11; render(); break;
    case "mes-next": ui.custosMes = ui.custosMes<11?ui.custosMes+1:0; render(); break;
    case "config-preco": {
      const qtd = el.getAttribute("data-qtd");
      state.config.precos[qtd] = Number(el.value)||0;
      await persistCustos(); render();
      break;
    }
    case "config-frete": state.config.frete = Number(el.value)||0; await persistCustos(); render(); break;
    case "config-tilapia": state.config.adicionalTilapia = Number(el.value)||0; await persistCustos(); render(); break;
  }
}

function showNovoIngredienteForm(){
  const container = document.getElementById("novo-ingr-form");
  if(!container) return;
  container.innerHTML = `
    <div style="background:var(--surface-2);border-radius:10px;padding:12px;margin-bottom:12px;">
      <div class="field"><input type="text" id="ni-nome" placeholder="Nome do ingrediente"></div>
      <div class="field"><input type="number" step="0.01" id="ni-preco" placeholder="Preço por kg (R$)"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" style="flex:1;padding:8px;" id="ni-salvar">Salvar</button>
        <button class="btn-ghost" style="flex:1;padding:8px;" id="ni-cancelar">Cancelar</button>
      </div>
    </div>`;
  document.getElementById("ni-cancelar").onclick = ()=>{ container.innerHTML=""; };
  document.getElementById("ni-salvar").onclick = async ()=>{
    const nome = document.getElementById("ni-nome").value.trim();
    const preco = Number(document.getElementById("ni-preco").value);
    if(!nome || !preco) return;
    state.ingredientes.push({id:uid(), nome, precoPorKg:preco, estimado:false});
    state.lastUpdated = Date.now();
    await persistCustos();
    render();
  };
}

async function salvarPedido(){
  syncDraftFromForm(true);
  const d = modalDraft;
  if(!d.nomeCliente.trim()) return;

  let pedido;
  if(d.personalizado){
    const valor = Number(d.valorManual)||0;
    if(valor<=0) return;
    pedido = {
      id: d.id || uid(),
      nomeCliente: d.nomeCliente.trim(), telefone: d.telefone.trim(), endereco: d.endereco.trim(),
      data: d.data, retirada: d.retirada, personalizado: true,
      quantidade: Number(d.quantidadeManual)||0, itens: [],
      itemPersonalizado: { descricao: d.itemPersonalizado.descricao.trim() },
      freteValor: 0, valorTotal: valor,
    };
  } else {
    if(!d.quantidade || totalItensEscolhidos()!==d.quantidade) return;
    const frete = d.retirada ? 0 : state.config.frete;
    let total = state.config.precos[d.quantidade] + frete;
    d.itens.forEach(item=>{
      const dish = getDish(item.marmitaId);
      if(dish && dish.adicionalTilapia) total += state.config.adicionalTilapia * item.quantidade;
    });
    pedido = {
      id: d.id || uid(),
      nomeCliente: d.nomeCliente.trim(), telefone: d.telefone.trim(), endereco: d.endereco.trim(),
      data: d.data, retirada: d.retirada, personalizado: false,
      quantidade: d.quantidade, itens: d.itens,
      freteValor: frete, valorTotal: total,
    };
  }

  if(d.id){ state.pedidos = state.pedidos.map(p=>p.id===d.id?pedido:p); }
  else state.pedidos.push(pedido);

  await persistPedidos();
  closeModal();
}

function exportarCSV(){
  const rows = [["Data","Cliente","Telefone","Endereço","Quantidade","Itens","Frete","Valor Total"]];
  state.pedidos.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(p=>{
    const itensStr = p.personalizado ? p.itemPersonalizado.descricao :
      p.itens.map(i=>{ const v=variacaoIdFromItem(i); return `${i.quantidade}x ${v?nomeVariacaoCompleto(v):""}`; }).join(" | ");
    rows.push([p.data,p.nomeCliente,p.telefone,p.endereco,p.quantidade,itensStr,(p.freteValor||0).toFixed(2),p.valorTotal.toFixed(2)]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `pedidos-marmitas-${todayISO()}.csv`;
  link.click();
}

/* =========================================================
   INIT
   ========================================================= */
loadAll();
</script>
